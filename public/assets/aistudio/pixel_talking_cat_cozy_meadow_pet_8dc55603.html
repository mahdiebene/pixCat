    // -------------------------------------------------------------------------
    function getCatCenter() {
      if (state.screen === 'title') return { x: W / 2, y: 134, r: 42 };
      if (state.screen === 'bedroom') {
        return state.bedroom.sleeping
          ? { x: 218, y: 162, r: 34 }
          : { x: 152, y: 182, r: 34 };
      }
      if (state.screen === 'bathroom') return { x: 180, y: 174, r: 34 };
      if (state.screen === 'playroom') return { x: 180, y: 178, r: 36 };
      if (state.screen === 'kitchen') return { x: 178, y: 174, r: 36 };
      if (state.screen === 'closet') return { x: 180, y: 174, r: 38 };
      return { x: W / 2, y: 160, r: 34 };
    }

    function addStat(key, delta) {
      state.stats[key] = Math.max(0, Math.min(100, state.stats[key] + delta));
      updateHUD();
    }

    function addCoins(amount) {
      state.coins = Math.max(0, state.coins + amount);
      if (amount > 0) audio.playCoin();
      updateHUD();
      saveState();
    }

    const SWEET_LINES = ['PURR~ <3', 'I <3 U!', 'SO COZY!', 'NYAA~', 'BESTIES!', 'HEHE!'];
    const MEOW_LINES = ['MEOW!', 'MEW MEW~', 'FISH PLS!', 'LOVE U!', 'PRRR~'];

    function petCat(x, y) {
      if (state.bedroom.sleeping && state.screen === 'bedroom') {
        spawnParticles('heart', x, y - 12, 2);
        audio.playPurr();
        return;
      }
      state.cat.expression = 'happy';
      state.cat.exprTimer = 1.4;
      addStat('fun', 3);
      spawnParticles('heart', x, y - 14, 3);
      if (state.cat.purrCooldown <= 0) {
        audio.playPurr();
        state.cat.purrCooldown = 0.65;
        state.cat.speechText = SWEET_LINES[Math.floor(Math.random() * SWEET_LINES.length)];
        state.cat.speechTimer = 1.8;
        if (Math.random() < 0.25) addCoins(1);
      }
    }

    function boopCat() {
      if (state.bedroom.sleeping && state.screen === 'bedroom') {
        toggleSleep();
        return;
      }
      state.cat.expression = 'surprised';
      state.cat.exprTimer = 0.85;
      state.cat.hopVy = -115;
      audio.playBoop();
      const c = getCatCenter();
      spawnParticles('sparkle', c.x, c.y - 24, 4);
      state.cat.speechText = 'BOOP!';
      state.cat.speechTimer = 1.2;
      addStat('fun', 2);
    }

    function triggerSyntheticMeow() {
      const v = Math.floor(Math.random() * 4);
      audio.playMeow(v);
      state.cat.expression = 'talking';
      state.cat.exprTimer = 0.65;
      state.cat.mouthOpen = 0.9;
      state.cat.hopVy = -60;
      state.cat.speechText = MEOW_LINES[Math.floor(Math.random() * MEOW_LINES.length)];
      state.cat.speechTimer = 1.8;
      const c = getCatCenter();
      spawnParticles('note', c.x + 14, c.y - 24, 3);
      addStat('fun', 5);
    }

    function tossYarnBall() {
      audio.playBoop();
      const y = state.playroom.yarn;
      y.x = 180 + (Math.random() > 0.5 ? 70 : -70);
      y.y = 140;
      y.vx = (180 - y.x) * 1.4 + (Math.random() - 0.5) * 40;
      y.vy = -120;
      y.active = true;
      state.cat.expression = 'happy';
      state.cat.exprTimer = 1.2;
      state.cat.hopVy = -95;
      state.cat.speechText = 'YARN!!';
      state.cat.speechTimer = 1.4;
      addStat('fun', 8);
      if (Math.random() < 0.4) addCoins(1);
    }

    function toggleLamp() {
      state.bedroom.lampOn = !state.bedroom.lampOn;
      audio.playClick();
      updateActionDeck();
    }

    function toggleSleep() {
      state.bedroom.sleeping = !state.bedroom.sleeping;
      audio.playClick();
      if (state.bedroom.sleeping) {
        state.bedroom.lampOn = false;
        state.cat.speechText = 'NIGHT NIGHT~';
        state.cat.speechTimer = 2.0;
      } else {
        state.bedroom.lampOn = true;
        state.cat.expression = 'happy';
        state.cat.exprTimer = 1.2;
        state.cat.speechText = 'GOOD MORNING!';
        state.cat.speechTimer = 1.8;
      }
      updateActionDeck();
    }

    function toggleSponge() {
      state.bathroom.spongeActive = !state.bathroom.spongeActive;
      if (state.bathroom.spongeActive && state.bathroom.showerOn) {
        state.bathroom.showerOn = false;
        audio.setShowerSound(false);
      }
      audio.playClick();
      updateActionDeck();
    }

    function toggleShower() {
      state.bathroom.showerOn = !state.bathroom.showerOn;
      if (state.bathroom.showerOn) {
        state.bathroom.spongeActive = false;
        audio.setShowerSound(true);
      } else {
        audio.setShowerSound(false);
      }
      audio.playClick();
      updateActionDeck();
    }

    function squeakDuck() {
      audio.playDuckSqueak();
      state.bathroom.duckHop = 12;
      spawnParticles('bubble', 154, 212, 3);
      addStat('fun', 2);
    }

    function feedFood(foodId) {
      const food = FOODS.find(f => f.id === foodId);
      if (!food) return;
      if (state.kitchen.flyingFood) return;
      if (state.coins < food.cost) {
        showToast(`Need ${food.cost} coins! Play Fish Catch!`);
        audio.playClick();
        return;
      }
      if (food.cost > 0) {
        state.coins -= food.cost;
        updateHUD();
      }
      audio.playBoop();
      state.kitchen.flyingFood = {
        id: food.id,
        sx: 180,
        sy: 255,
        x: 180,
        y: 255,
        t: 0,
        food
      };
    }

    function selectAccessory(accId) {
      const acc = ACCESSORIES.find(a => a.id === accId);
      if (!acc) return;
      if (state.ownedAccessories.includes(accId)) {
        state.accessory = accId;
        audio.playClick();
        state.cat.hopVy = -70;
        state.cat.expression = 'happy';
        state.cat.exprTimer = 1.0;
        spawnParticles('sparkle', 180, 154, 6);
        saveState();
        updateActionDeck();
      } else {
        if (state.coins < acc.cost) {
          showToast(`Need ${acc.cost} coins! Play Fish Catch!`);
          audio.playClick();
          return;
        }
        state.coins -= acc.cost;
        state.ownedAccessories.push(accId);
        state.accessory = accId;
        audio.playCoin();
        state.cat.hopVy = -90;
        state.cat.expression = 'happy';
        state.cat.exprTimer = 1.4;
        state.cat.speechText = 'SO STYLISH!';
        state.cat.speechTimer = 1.8;
        spawnParticles('sparkle', 180, 154, 8);
        updateHUD();
        saveState();
        updateActionDeck();
      }
    }

    function selectFur(furId) {
      if (!FUR_PALETTES[furId]) return;
      state.fur = furId;
      audio.playClick();
      state.cat.hopVy = -60;
      spawnParticles('sparkle', 180, 168, 6);
      saveState();
      updateActionDeck();
    }

    function startFishCatch() {
      const mg = state.playroom.miniGame;
      mg.active = true;
      mg.score = 0;
      mg.coinsEarned = 0;
      mg.timeLeft = 30;
      mg.catX = W / 2;
      mg.targetX = W / 2;
      mg.items = [];
      mg.spawnTimer = 0.3;
      mg.gameOver = false;
      audio.playStartChime();
      updateActionDeck();
    }

    function exitFishCatch() {
      state.playroom.miniGame.active = false;
      audio.playClick();
      updateActionDeck();
    }

    // -------------------------------------------------------------------------
    // 11. SCREEN NAVIGATION & CONTEXTUAL ACTION DECK UI
    // -------------------------------------------------------------------------
    const hudBar = document.getElementById('hudBar');
    const actionDeck = document.getElementById('actionDeck');

    function goToScreen(next) {
      // Clean up room-specific loops/sounds when leaving
      if (state.bathroom.showerOn) {
        state.bathroom.showerOn = false;
        audio.setShowerSound(false);
      }
      if (state.playroom.recording) audio.stopRecording();
      state.playroom.miniGame.active = false;
      state.bathroom.spongeActive = false;

      state.screen = next;
      state.hoveredRoom = null;
      state.cat.speechTimer = 0;
      state.cat.expression = 'idle';

      if (next === 'title') {
        hudBar.classList.add('hidden');
        hudBar.classList.remove('flex');
        actionDeck.classList.add('hidden');
      } else {
        hudBar.classList.remove('hidden');
        hudBar.classList.add('flex');
        actionDeck.classList.remove('hidden');
      }

      document.getElementById('btnMap').textContent = next === 'hub' ? '🏠 TITLE' : '🗺 MAP';
      updateHUD();
      updateActionDeck();
    }

    function updateHUD() {
      document.getElementById('petNameDisplay').textContent = state.petName;
      document.getElementById('coinDisplay').textContent = state.coins;
      document.getElementById('btnSound').textContent = state.muted ? '🔇' : '🔊';

      const setBar = (idVal, idBar, val, baseColor) => {
        const v = Math.round(val);
        document.getElementById(idVal).textContent = `${v}%`;
        const el = document.getElementById(idBar);
        el.style.width = `${v}%`;
        el.className = 'stat-fill ' + (v < 25 ? 'bg-rose-500' : v < 50 ? 'bg-amber-400' : baseColor);
      };

      setBar('valHunger', 'barHunger', state.stats.hunger, 'bg-emerald-400');
      setBar('valHygiene', 'barHygiene', state.stats.hygiene, 'bg-sky-400');
      setBar('valEnergy', 'barEnergy', state.stats.energy, 'bg-purple-400');
      setBar('valFun', 'barFun', state.stats.fun, 'bg-pink-400');
    }

    function updateActionDeck() {
      actionDeck.innerHTML = '';

      if (state.screen === 'hub') {
        actionDeck.innerHTML = `
          <div class="text-[8.5px] text-amber-100/90 text-center leading-relaxed px-2">
            PICK A COZY ROOM TO CARE FOR <span class="text-pink-300">${state.petName}</span>!
            <span class="text-emerald-300">RUB CAT TO PET • TAP TO BOOP</span>
          </div>
        `;
        return;
      }

      if (state.screen === 'playroom') {
        if (state.playroom.miniGame.active) {
          const mg = state.playroom.miniGame;
          actionDeck.innerHTML = `
            <button id="btnMgLeft" class="px-btn !px-4">◀</button>
            <button id="btnMgRight" class="px-btn !px-4">▶</button>
            ${mg.gameOver ? `<button id="btnMgAgain" class="px-btn px-btn-green">↻ PLAY AGAIN</button>` : ''}
            <button id="btnMgExit" class="px-btn px-btn-pink">✕ EXIT</button>
          `;
          const bL = document.getElementById('btnMgLeft');
          const bR = document.getElementById('btnMgRight');
          bL.onpointerdown = () => (state.keys.left = true);
          bL.onpointerup = bL.onpointerleave = () => (state.keys.left = false);
          bR.onpointerdown = () => (state.keys.right = true);
          bR.onpointerup = bR.onpointerleave = () => (state.keys.right = false);
          if (mg.gameOver) document.getElementById('btnMgAgain').onclick = startFishCatch;
          document.getElementById('btnMgExit').onclick = exitFishCatch;
          return;
        }

        actionDeck.innerHTML = `
          <button id="btnTalk" class="px-btn ${state.playroom.recording ? 'px-btn-recording' : 'px-btn-pink'}">
            ${state.playroom.recording ? '⏹ STOP & MIMIC' : '🎙 HOLD / TAP TO TALK'}
          </button>
          <button id="btnMeow" class="px-btn px-btn-amber">🐱 SAY MEOW</button>
          <button id="btnYarn" class="px-btn px-btn-cyan">🧶 YARN BALL</button>
          <button id="btnFishGame" class="px-btn px-btn-green">🐟 FISH CATCH</button>
        `;

        const btnTalk = document.getElementById('btnTalk');
        let pressStart = 0;
        btnTalk.onpointerdown = (e) => {
          e.preventDefault();
          pressStart = performance.now();
          if (state.playroom.recording) {
            audio.stopRecording();
          } else {
            audio.startRecording();
          }
        };
        btnTalk.onpointerup = () => {
          // If user held button longer than 350ms, release stops & mimics automatically!
          if (state.playroom.recording && performance.now() - pressStart > 350) {
            audio.stopRecording();
          }
        };

        document.getElementById('btnMeow').onclick = triggerSyntheticMeow;
        document.getElementById('btnYarn').onclick = tossYarnBall;
        document.getElementById('btnFishGame').onclick = startFishCatch;
        return;
      }

      if (state.screen === 'bedroom') {
        actionDeck.innerHTML = `
          <button id="btnLamp" class="px-btn ${state.bedroom.lampOn ? 'px-btn-amber' : ''}">
            ${state.bedroom.lampOn ? '💡 LAMP: ON' : '🌙 LAMP: OFF'}
          </button>
          <button id="btnSleep" class="px-btn ${state.bedroom.sleeping ? 'px-btn-green' : 'px-btn-pink'}">
            ${state.bedroom.sleeping ? '☀ WAKE UP' : '🛏 TUCK IN BED'}
          </button>
        `;
        document.getElementById('btnLamp').onclick = toggleLamp;
        document.getElementById('btnSleep').onclick = toggleSleep;
        return;
      }

      if (state.screen === 'bathroom') {
        actionDeck.innerHTML = `
          <button id="btnSponge" class="px-btn ${state.bathroom.spongeActive ? 'px-btn-amber active' : 'px-btn-amber'}">
            🧽 ${state.bathroom.spongeActive ? 'RUB CAT!' : 'SOAP SPONGE'}
          </button>
          <button id="btnShower" class="px-btn ${state.bathroom.showerOn ? 'px-btn-cyan active' : 'px-btn-cyan'}">
            🚿 ${state.bathroom.showerOn ? 'SHOWER: ON' : 'SHOWER: OFF'}
          </button>
          <button id="btnDuck" class="px-btn px-btn-pink">🐥 SQUEAK</button>
        `;
        document.getElementById('btnSponge').onclick = toggleSponge;
        document.getElementById('btnShower').onclick = toggleShower;
        document.getElementById('btnDuck').onclick = squeakDuck;
        return;
      }

      if (state.screen === 'kitchen') {
        FOODS.forEach(f => {
          const btn = document.createElement('button');
          btn.className = 'px-btn ' + (f.cost === 0 ? 'px-btn-green' : 'px-btn-amber');
          btn.innerHTML = `${f.icon} ${f.label} <span class="text-[7.5px] opacity-90">${f.cost === 0 ? 'FREE' : f.cost + '●'}</span>`;
          btn.onclick = () => feedFood(f.id);
          actionDeck.appendChild(btn);
        });
        return;
      }

      if (state.screen === 'closet') {
        const tabs = document.createElement('div');
        tabs.className = 'w-full flex justify-center gap-2 pb-1';
        tabs.innerHTML = `
          <button id="tabAcc" class="px-btn !py-1.5 !text-[8px] ${state.closetTab === 'acc' ? 'px-btn-pink' : ''}">🎀 ACCESSORIES</button>
          <button id="tabFur" class="px-btn !py-1.5 !text-[8px] ${state.closetTab === 'fur' ? 'px-btn-amber' : ''}">🎨 FUR COLORS</button>
        `;
        actionDeck.appendChild(tabs);
        document.getElementById('tabAcc').onclick = () => { state.closetTab = 'acc'; audio.playClick(); updateActionDeck(); };
        document.getElementById('tabFur').onclick = () => { state.closetTab = 'fur'; audio.playClick(); updateActionDeck(); };

        if (state.closetTab === 'acc') {
          ACCESSORIES.forEach(a => {
            const owned = state.ownedAccessories.includes(a.id);
            const equipped = state.accessory === a.id;
            const btn = document.createElement('button');
            btn.className = 'px-btn !text-[8px] ' + (equipped ? 'px-btn-green' : owned ? '' : 'px-btn-amber');
            btn.textContent = equipped ? `✓ ${a.label}` : owned ? a.label : `${a.label} ${a.cost}●`;
            btn.onclick = () => selectAccessory(a.id);
            actionDeck.appendChild(btn);
          });
        } else {
          Object.entries(FUR_PALETTES).forEach(([id, pal]) => {
            const equipped = state.fur === id;
            const btn = document.createElement('button');
            btn.className = 'px-btn !text-[8px] ' + (equipped ? 'px-btn-green' : '');
            btn.innerHTML = `<span style="display:inline-block;width:10px;height:10px;background:${pal.swatch};border:2px solid #09090d;border-radius:2px;"></span> ${pal.name}`;
            btn.onclick = () => selectFur(id);
            actionDeck.appendChild(btn);
          });
        }
      }
    }

    // Floating Toast Helper
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('pixelToast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    // -------------------------------------------------------------------------
    // 12. POINTER & KEYBOARD INPUT HANDLING
    // -------------------------------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width) * W,
        y: ((e.clientY - rect.top) / rect.height) * H
      };
    }

    function inRect(x, y, r) {
      return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    }

    function dist(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    canvas.addEventListener('pointerdown', (e) => {
      audio.ensure();
      const pt = getCanvasCoords(e);
      state.pointerDown = true;
      state.pointerX = state.lastPointerX = pt.x;
      state.pointerY = state.lastPointerY = pt.y;
      state.pointerDownTime = performance.now();
      state.pointerMovedDist = 0;

      // Mini-Game steering
      if (state.screen === 'playroom' && state.playroom.miniGame.active && !state.playroom.miniGame.gameOver) {
        state.playroom.miniGame.targetX = pt.x;
        return;
      }

      // Title screen: PLAY button check
      if (state.screen === 'title') {
        if (inRect(pt.x, pt.y, PLAY_BTN_RECT)) {
          audio.playStartChime();
          goToScreen('hub');
          return;
        }
      }

      // Hub screen: Room card clicks
      if (state.screen === 'hub') {
        for (const card of HUB_CARDS) {
          if (pt.x >= card.x && pt.x <= card.x + card.w && pt.y >= card.y && pt.y <= card.y + card.h + 14) {
            audio.playClick();
            goToScreen(card.id);
            return;
          }
        }
        return;
      }

      // Room clickable props!
      if (state.screen === 'bedroom') {
        // Click lamp
        if (dist(pt.x, pt.y, 95, 145) < 26) {
          toggleLamp();
          return;
        }
        // Click bed
        if (pt.x > 165 && pt.x < 280 && pt.y > 130 && pt.y < 212) {
          toggleSleep();
          return;
        }
      }

      if (state.screen === 'bathroom') {
        // Click yellow rubber ducky!
        if (dist(pt.x, pt.y, 154, 218) < 18) {
          squeakDuck();
          return;
        }
        // Click showerhead
        if (dist(pt.x, pt.y, 222, 78) < 24) {
          toggleShower();
          return;
        }
      }

      if (state.screen === 'playroom') {
        // Click yarn ball
        const y = state.playroom.yarn;
        if (dist(pt.x, pt.y, y.x, y.y) < 18) {
          tossYarnBall();
          return;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const pt = getCanvasCoords(e);
      const dx = pt.x - state.pointerX;
      const dy = pt.y - state.pointerY;
      const stepDist = Math.hypot(dx, dy);
      state.pointerX = pt.x;
      state.pointerY = pt.y;

      // Mini-game drag steering
      if (state.screen === 'playroom' && state.playroom.miniGame.active && !state.playroom.miniGame.gameOver) {
        state.playroom.miniGame.targetX = pt.x;
        return;
      }

      // Hover states for Title & Hub
      if (state.screen === 'title') {
        state.hoveredPlayBtn = inRect(pt.x, pt.y, PLAY_BTN_RECT);
      } else if (state.screen === 'hub') {
        state.hoveredRoom = null;
        for (const card of HUB_CARDS) {
          if (pt.x >= card.x && pt.x <= card.x + card.w && pt.y >= card.y && pt.y <= card.y + card.h + 14) {
            state.hoveredRoom = card.id;
            break;
          }
        }
        return;
      }

      // Rubbing / Petting / Soap Scrubbing the Cat!
      if (state.pointerDown) {
        state.pointerMovedDist += stepDist;
        const cat = getCatCenter();
        if (dist(pt.x, pt.y, cat.x, cat.y) < cat.r) {
          if (state.screen === 'bathroom' && state.bathroom.spongeActive) {
            // Scrub soap bubbles onto cat!
            state.cat.petRubDist += stepDist;
            if (state.cat.petRubDist > 14) {
              state.cat.petRubDist = 0;
              audio.playBubblePop();
              state.bathroom.soapLevel = Math.min(100, state.bathroom.soapLevel + 10);
              if (state.bathroom.soapBubbles.length < 18) {
                state.bathroom.soapBubbles.push({
                  rx: (Math.random() - 0.5) * 14,
                  ry: (Math.random() - 0.5) * 14,
                  r: 2 + Math.random() * 2.5
                });
              }
              spawnParticles('bubble', pt.x, pt.y, 2);
              state.cat.expression = 'happy';
              state.cat.exprTimer = 0.8;
              addStat('hygiene', 2);
            }
          } else {
            // Normal petting rub!
            state.cat.petRubDist += stepDist;
            if (state.cat.petRubDist > 26) {
              state.cat.petRubDist = 0;
              petCat(pt.x, pt.y);
            }
          }
        }
      }
    });

    function endPointer() {
      if (state.pointerDown && state.pointerMovedDist < 9 && performance.now() - state.pointerDownTime < 280) {
        // Quick tap directly on cat = funny boop!
        if (state.screen !== 'hub' && !state.playroom.miniGame.active) {
          const cat = getCatCenter();
          if (dist(state.pointerX, state.pointerY, cat.x, cat.y) < cat.r) {
            if (!(state.screen === 'bathroom' && state.bathroom.spongeActive)) {
              boopCat();
            }
          }
        }
      }
      state.pointerDown = false;
    }

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave', () => {
      state.pointerDown = false;
      state.hoveredRoom = null;
      state.hoveredPlayBtn = false;
    });

    // Keyboard Controls for Fish Catch Mini-Game
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
    });

    // Top HUD Button Listeners
    document.getElementById('btnMap').onclick = () => {
      audio.playClick();
      if (state.screen === 'hub') {
        goToScreen('title');
      } else {
        goToScreen('hub');
      }
    };

    document.getElementById('btnSound').onclick = () => {
      state.muted = !state.muted;
      if (state.muted) audio.setShowerSound(false);
      else if (state.bathroom.showerOn) audio.setShowerSound(true);
      audio.playClick();
      updateHUD();
      saveState();
    };

    // Custom Rename Modal Listeners
    const renameModal = document.getElementById('renameModal');
    const renameInput = document.getElementById('renameInput');

    document.getElementById('btnRename').onclick = () => {
      audio.playClick();
      renameInput.value = state.petName;
      renameModal.classList.add('open');
      setTimeout(() => renameInput.focus(), 50);
    };
    document.getElementById('btnCancelRename').onclick = () => {
      audio.playClick();
      renameModal.classList.remove('open');
    };
    document.getElementById('btnSaveRename').onclick = () => {
      const cleaned = renameInput.value.trim().toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10);
      if (cleaned) {
        state.petName = cleaned;
        saveState();
        updateHUD();
        updateActionDeck();
        showToast(`Say hi to ${state.petName}!`);
      }
      audio.playCoin();
      renameModal.classList.remove('open');
    };
    renameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnSaveRename').click();
      if (e.key === 'Escape') document.getElementById('btnCancelRename').click();
    });

    // -------------------------------------------------------------------------
    // 13. MAIN SIMULATION & ANIMATION LOOP (60 FPS)
    // -------------------------------------------------------------------------
    let lastTime = 0;
    let statDecayAcc = 0;
    let sleepZzzAcc = 0;
    let lullabyStep = 0;

    function update(dt) {
      // Sample live Web Audio amplitude for Voice Mimic mouth sync
      audio.sampleAmplitude();

      // Gentle gradual stat decay over time (when playing past title screen)
      if (state.screen !== 'title') {
        statDecayAcc += dt;
        if (statDecayAcc >= 4.0) {
          statDecayAcc = 0;
          state.stats.hunger = Math.max(5, state.stats.hunger - 0.8);
          state.stats.hygiene = Math.max(5, state.stats.hygiene - 0.5);
          state.stats.fun = Math.max(5, state.stats.fun - 0.7);
          if (!state.bedroom.sleeping) {
            state.stats.energy = Math.max(5, state.stats.energy - 0.6);
          }
          updateHUD();
          saveState();
        }
      }

      // Cat blinking & expression timers
      state.cat.blinkTimer -= dt;
      if (state.cat.blinkTimer <= 0) {
        state.cat.isBlinking = !state.cat.isBlinking;
        state.cat.blinkTimer = state.cat.isBlinking ? 0.14 : 2.2 + Math.random() * 2.5;
      }

      if (state.cat.exprTimer > 0) {
        state.cat.exprTimer -= dt;
        if (state.cat.exprTimer <= 0 && !state.playroom.mimicking) {
          state.cat.expression = 'idle';
          state.cat.mouthOpen = 0;
        }
      }

      if (state.cat.speechTimer > 0) state.cat.speechTimer -= dt;
      if (state.cat.purrCooldown > 0) state.cat.purrCooldown -= dt;

      // Cat hop physics
      if (state.cat.hopY < 0 || state.cat.hopVy !== 0) {
        state.cat.hopY += state.cat.hopVy * dt;
        state.cat.hopVy += 420 * dt;
        if (state.cat.hopY >= 0) {
          state.cat.hopY = 0;
          state.cat.hopVy = 0;
        }
      }

      // Bedroom sleeping energy regeneration + Zzz + gentle lullaby notes
      if (state.screen === 'bedroom' && state.bedroom.sleeping) {
        addStat('energy', dt * 7.5);
        sleepZzzAcc += dt;
        if (sleepZzzAcc > 0.9) {
          sleepZzzAcc = 0;
          spawnParticles('zzz', 226, 138, 1);
          audio.playLullabyNote(lullabyStep++);
        }
      }

      // Bathroom duck hop decay + Shower water drops + rinsing bubbles!
      if (state.bathroom.duckHop > 0) {
        state.bathroom.duckHop = Math.max(0, state.bathroom.duckHop - dt * 45);
      }

      if (state.screen === 'bathroom' && state.bathroom.showerOn) {
        // Spawn fresh water droplets from showerhead
        for (let i = 0; i < 3; i++) {
          state.bathroom.waterDrops.push({
            x: 158 + Math.random() * 48,
            y: 82 + Math.random() * 14,
            vy: 155 + Math.random() * 55
          });
        }
        state.bathroom.waterDrops.forEach(d => { d.y += d.vy * dt; });
        state.bathroom.waterDrops = state.bathroom.waterDrops.filter(d => d.y < 194);

        // Rinse soap bubbles into sparkles & boost Hygiene!
        if (state.bathroom.soapBubbles.length > 0 && Math.random() < dt * 7) {
          const popped = state.bathroom.soapBubbles.pop();
          spawnParticles('sparkle', 180 + popped.rx * 3, 174 + popped.ry * 3, 2);
          addStat('hygiene', 8);
          if (state.bathroom.soapBubbles.length === 0) {
            state.stats.hygiene = 100;
            addCoins(5);
            state.cat.speechText = 'SQUEAKY CLEAN!';
            state.cat.speechTimer = 2.2;
            state.cat.expression = 'happy';
            state.cat.exprTimer = 2.0;
            spawnParticles('sparkle', 180, 160, 10);
            showToast('+5 Coins! Sparkling clean!');
          }
        } else {
          addStat('hygiene', dt * 6);
        }
      } else {
        state.bathroom.waterDrops = [];
      }

      // Playroom Yarn Ball bounce physics
      if (state.screen === 'playroom' && !state.playroom.miniGame.active) {
        const y = state.playroom.yarn;
        if (y.active) {
          y.x += y.vx * dt;
          y.y += y.vy * dt;
          y.vy += 320 * dt;
          if (y.y > 202) {
            y.y = 202;
            y.vy = -y.vy * 0.55;
            y.vx *= 0.82;
            if (Math.abs(y.vy) < 20) {
              y.vy = 0;
              y.vx *= 0.85;
              if (Math.abs(y.vx) < 4) y.active = false;
            }
          }
          if (y.x < 92 || y.x > 268) y.vx = -y.vx;
        }
      }

      // Playroom Fish Catch Mini-Game Simulation
      if (state.screen === 'playroom' && state.playroom.miniGame.active) {
        const mg = state.playroom.miniGame;
        if (!mg.gameOver) {
          mg.timeLeft -= dt;
          if (mg.timeLeft <= 0) {
            mg.timeLeft = 0;
            mg.gameOver = true;
            if (mg.score > state.highScore) state.highScore = mg.score;
            addCoins(mg.coinsEarned);
            addStat('fun', 22);
            saveState();
            updateActionDeck();
          }

          // Smooth Cat steering (Keyboard + Pointer)
          const speed = 220;
          if (state.keys.left) mg.targetX = mg.catX - speed * dt * 2;
          if (state.keys.right) mg.targetX = mg.catX + speed * dt * 2;
          mg.targetX = Math.max(28, Math.min(W - 28, mg.targetX));
          mg.catX += (mg.targetX - mg.catX) * Math.min(1, dt * 14);

          // Spawn falling goodies & boots
          mg.spawnTimer -= dt;
          if (mg.spawnTimer <= 0) {
            mg.spawnTimer = 0.52 + Math.random() * 0.32;
            const r = Math.random();
            const type = r < 0.52 ? 'fish' : r < 0.72 ? 'star' : r < 0.86 ? 'heart' : 'boot';
            mg.items.push({
              type,
              x: 28 + Math.random() * (W - 56),
              y: 26,
              vy: 75 + Math.random() * 55 + (30 - mg.timeLeft) * 1.4
            });
          }

          // Update items & collision detection
          for (let i = mg.items.length - 1; i >= 0; i--) {
            const it = mg.items[i];
            it.y += it.vy * dt;
            if (dist(it.x, it.y, mg.catX, 206) < 26) {
              if (it.type === 'boot') {
                audio.playBoop();
                mg.score = Math.max(0, mg.score - 10);
                state.cat.expression = 'surprised';
                state.cat.exprTimer = 0.6;
                state.cat.hopVy = -80;
              } else {
                audio.playCoin();
                const pts = it.type === 'star' ? 25 : it.type === 'heart' ? 15 : 10;
                const cns = it.type === 'star' ? 3 : 1;
                mg.score += pts;
                mg.coinsEarned += cns;
                state.cat.expression = 'happy';
                state.cat.exprTimer = 0.5;
                spawnParticles(it.type === 'heart' ? 'heart' : 'sparkle', it.x, it.y, 4);
              }
              mg.items.splice(i, 1);
            } else if (it.y > 235) {
              mg.items.splice(i, 1);
            }
          }
        }
      }

      // Kitchen tossed food parabolic arc
      if (state.kitchen.flyingFood) {
        const ff = state.kitchen.flyingFood;
        ff.t += dt * 2.4;
        const p = Math.min(1, ff.t);
        ff.x = ff.sx + (178 - ff.sx) * p;
        ff.y = ff.sy + (168 - ff.sy) * p - Math.sin(p * Math.PI) * 52;
        if (p >= 1) {
          const food = ff.food;
          state.kitchen.flyingFood = null;
          audio.playCrunch();
          state.cat.expression = 'eating';
          state.cat.exprTimer = 1.1;
          state.cat.hopVy = -55;
          state.cat.speechText = food.msg;
          state.cat.speechTimer = 1.9;
          addStat('hunger', food.hunger);
          addStat('fun', food.fun);
          addStat('energy', food.energy);
          spawnParticles('crumb', 178, 174, 6);
          spawnParticles('heart', 178, 150, 3);
          saveState();
        }
      }

      // Update Particles
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }
    }

    function render(time) {
      ctx.clearRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false;

      if (state.screen === 'title') {
        drawTitleScreen(ctx, time);
      } else if (state.screen === 'hub') {
        drawHubScreen(ctx, time);
      } else {
        drawFullRoomScene(ctx, state.screen, time);
      }

      drawParticles(ctx);
      drawSpeechBubble(ctx);
    }

    function gameLoop(ts) {
      const time = ts / 1000;
      const dt = Math.min(0.05, lastTime ? (ts - lastTime) / 1000 : 0.016);
      lastTime = ts;

      update(dt);
      render(time);
      requestAnimationFrame(gameLoop);
    }

    // Initialize game cleanly on window load
    window.onload = function () {
      loadState();
      goToScreen('title');
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
