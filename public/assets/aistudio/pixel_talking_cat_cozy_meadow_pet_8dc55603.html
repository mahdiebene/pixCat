<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mochi - Pixel Talking Cat</title>
  <!-- Load Tailwind CSS for responsive layout helpers -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load retro pixel font Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       COZY RETRO PIXEL THEME & CUSTOM BUTTON STYLING
       ========================================================================= */
    :root {
      --bg-outer: #0e2419;
      --bg-cabinet: #183627;
      --meadow-green: #1f4d36;
      --slate-btn: #525c94;
      --slate-btn-dark: #383f6b;
      --slate-btn-light: #7580bd;
      --cream-pill: #f4efe6;
      --ink-red: #9c3838;
      --navy-card: #2a3356;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-outer);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(46, 107, 74, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(42, 51, 86, 0.3) 0%, transparent 50%);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      color: #f4efe6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Pixel-crisp canvas rendering */
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      touch-action: none;
    }

    /* Main responsive game shell */
    .game-shell {
      width: 100%;
      max-width: 780px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Pixel Cabinet Frame */
    .pixel-frame {
      background: #132c1f;
      border: 4px solid #09140e;
      border-radius: 14px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.55),
        inset 0 2px 0 rgba(255, 255, 255, 0.08);
      padding: 8px;
    }

    /* Canvas wrapper maintaining crisp 4:3 aspect ratio */
    .canvas-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #1f4d36;
      border: 4px solid #09140e;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 0 2px #143324;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Chunky Retro Pixel Buttons */
    .px-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      line-height: 1.25;
      color: #ffffff;
      background: linear-gradient(180deg, #626da8 0%, #4d568c 65%, #3d4573 100%);
      border: 3px solid #0a0c14;
      border-radius: 10px;
      padding: 9px 12px;
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, 0.25),
        inset 0 -3px 0 rgba(0, 0, 0, 0.3),
        0 4px 0 #0a0c14;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    .px-btn:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .px-btn:active:not(:disabled),
    .px-btn.active {
      transform: translateY(3px);
      box-shadow:
        inset 0 2px 0 rgba(0, 0, 0, 0.25),
        0 1px 0 #0a0c14;
    }

    .px-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .px-btn-pink {
      background: linear-gradient(180deg, #e87fa5 0%, #cf5d88 65%, #a84269 100%);
    }

    .px-btn-green {
      background: linear-gradient(180deg, #52b878 0%, #38945b 65%, #277043 100%);
    }

    .px-btn-amber {
      background: linear-gradient(180deg, #f0b849 0%, #d99526 65%, #b37417 100%);
    }

    .px-btn-cyan {
      background: linear-gradient(180deg, #5ebfd4 0%, #3d9ab0 65%, #2b778a 100%);
    }

    .px-btn-cream {
      background: linear-gradient(180deg, #faf6ee 0%, #ebe3d5 100%);
      color: #8c3434;
      text-shadow: none;
    }

    .px-btn-recording {
      background: linear-gradient(180deg, #ff5e6c 0%, #d93644 65%, #a61f2c 100%);
      animation: recPulse 0.7s infinite alternate;
    }

    @keyframes recPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.25); }
    }

    /* HUD Bar Styling */
    .hud-panel {
      background: #1f2847;
      border: 3px solid #090d1a;
      border-radius: 10px;
      padding: 8px 10px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.1);
    }

    .stat-track {
      height: 10px;
      background: #0d1221;
      border: 2px solid #06080f;
      border-radius: 4px;
      overflow: hidden;
      min-width: 46px;
    }

    .stat-fill {
      height: 100%;
      transition: width 0.25s ease, background-color 0.25s ease;
    }

    /* Contextual Bottom Action Deck */
    .action-deck {
      background: #1b2440;
      border: 3px solid #090d1a;
      border-radius: 10px;
      padding: 10px;
      min-height: 64px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.08);
    }

    /* Floating Retro Toast */
    .pixel-toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #f4efe6;
      color: #2a3356;
      border: 3px solid #0a0c14;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 9px;
      line-height: 1.4;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 30;
      text-align: center;
      max-width: 90%;
    }

    .pixel-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Custom Pixel Modal (for Pet Renaming - zero prompt()/alert()) */
    .pixel-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 16, 12, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .pixel-modal-backdrop.open {
      display: flex;
    }

    .pixel-modal {
      background: #242e4f;
      border: 4px solid #0a0c14;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .pixel-input {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 10px 12px;
      background: #f4efe6;
      color: #1f2847;
      border: 3px solid #0a0c14;
      border-radius: 8px;
      outline: none;
      text-transform: uppercase;
      text-align: center;
    }

    @media (max-width: 600px) {
      .game-shell {
        padding: 4px;
        gap: 6px;
      }
      .pixel-frame {
        padding: 5px;
      }
      .px-btn {
        font-size: 8.5px;
        padding: 8px 9px;
      }
      .hud-panel {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>
  <!-- Main Responsive Retro Game Shell -->
  <div class="game-shell">
    <div class="pixel-frame flex flex-col gap-2">

      <!-- TOP HUD BAR (Hidden on pure Title Screen, visible on Hub & Rooms) -->
      <div id="hudBar" class="hud-panel hidden flex-col gap-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <!-- Editable Pet Name Badge -->
          <div class="flex items-center gap-2">
            <button id="btnRename" class="px-btn px-btn-cream !py-1.5 !px-2.5 !text-[9px]" title="Click to rename your kitty!">
              <span>🐱</span>
              <span id="petNameDisplay">MOCHI</span>
              <span class="opacity-60 text-[8px]">✎</span>
            </button>
            <div class="flex items-center gap-1.5 bg-[#12182e] border-2 border-[#080b14] rounded-lg px-2.5 py-1.5 text-[9px] text-amber-300">
              <span>●</span>
              <span id="coinDisplay">25</span>
            </div>
          </div>

          <!-- Navigation & Audio Controls -->
          <div class="flex items-center gap-1.5">
            <button id="btnSound" class="px-btn !py-1.5 !px-2.5 !text-[9px]" title="Toggle 8-bit Sound">🔊</button>
            <button id="btnMap" class="px-btn px-btn-green !py-1.5 !px-2.5 !text-[9px]">🗺 MAP</button>
          </div>
        </div>

        <!-- 4 Crisp Pixel Stat Bars -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-0.5">
          <div class="flex flex-col gap-1">
            <div class="flex justify-between text-[7.5px] text-amber-200">
              <span>🐟 HUNGER</span>
              <span id="valHunger">80%</span>
            </div>
            <div class="stat-track"><div id="barHunger" class="stat-fill bg-emerald-400" style="width:80%"></div></div>
          </div>
          <div class="flex flex-col gap-1">
            <div class="flex justify-between text-[7.5px] text-sky-200">
              <span>🫧 HYGIENE</span>
              <span id="valHygiene">80%</span>
            </div>
            <div class="stat-track"><div id="barHygiene" class="stat-fill bg-sky-400" style="width:80%"></div></div>
          </div>
          <div class="flex flex-col gap-1">
            <div class="flex justify-between text-[7.5px] text-purple-200">
              <span>🌙 ENERGY</span>
              <span id="valEnergy">80%</span>
            </div>
            <div class="stat-track"><div id="barEnergy" class="stat-fill bg-purple-400" style="width:80%"></div></div>
          </div>
          <div class="flex flex-col gap-1">
            <div class="flex justify-between text-[7.5px] text-pink-200">
              <span>💖 FUN</span>
              <span id="valFun">80%</span>
            </div>
            <div class="stat-track"><div id="barFun" class="stat-fill bg-pink-400" style="width:80%"></div></div>
          </div>
        </div>
      </div>

      <!-- CRISP PIXEL ART GAME CANVAS -->
      <div class="canvas-stage">
        <canvas id="gameCanvas" width="360" height="270"></canvas>
        <!-- Non-intrusive Pixel Toast Message -->
        <div id="pixelToast" class="pixel-toast"></div>
      </div>

      <!-- CONTEXTUAL ROOM ACTION DECK (Outside Canvas for clean gameplay & touch usability) -->
      <div id="actionDeck" class="action-deck hidden"></div>

    </div>
  </div>

  <!-- CUSTOM PIXEL MODAL: RENAME PET -->
  <div id="renameModal" class="pixel-modal-backdrop">
    <div class="pixel-modal flex flex-col gap-4">
      <div class="text-[11px] text-amber-200 leading-relaxed">NAME YOUR KITTY</div>
      <input id="renameInput" type="text" maxlength="10" class="pixel-input" placeholder="MOCHI" />
      <div class="flex justify-center gap-3">
        <button id="btnCancelRename" class="px-btn !text-[9px]">CANCEL</button>
        <button id="btnSaveRename" class="px-btn px-btn-green !text-[9px]">SAVE</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       MOCHI - PIXEL TALKING CAT GAME ENGINE
       Single-file 100% procedural pixel art + Web Audio 8-bit synth + Voice Mimic
       Logical Resolution: 360 x 270 (4:3 crisp pixel ratio matching mockups)
       ========================================================================= */

    const W = 360;
    const H = 270;

    // -------------------------------------------------------------------------
    // 1. PERSISTENT GAME STATE
    // -------------------------------------------------------------------------
    const STORAGE_KEY = 'pixel_talking_cat_v1';

    const FUR_PALETTES = {
      classic: {
        name: 'CLASSIC',
        swatch: '#b59282',
        body: '#ffffff',
        shade: '#ded9d5',
        patch: '#b59282',
        patchDark: '#8c6d5f',
        earInner: '#f2a499',
        blush: '#f59aa3',
        outline: '#09090d'
      },
      tabby: {
        name: 'TABBY',
        swatch: '#e88b43',
        body: '#ffe0b5',
        shade: '#f0c48d',
        patch: '#e88b43',
        patchDark: '#bd6526',
        earInner: '#f7a6a1',
        blush: '#f28b94',
        outline: '#09090d'
      },
      tuxedo: {
        name: 'TUXEDO',
        swatch: '#3a4154',
        body: '#3a4154',
        shade: '#272c3b',
        patch: '#ffffff',
        patchDark: '#d9dde8',
        earInner: '#e899a4',
        blush: '#f28d9d',
        outline: '#09090d'
      },
      cotton: {
        name: 'COTTON',
        swatch: '#f2a2d4',
        body: '#fff5fb',
        shade: '#ebd8e6',
        patch: '#f2a2d4',
        patchDark: '#c978ad',
        earInner: '#ffd1dc',
        blush: '#ff8fb8',
        outline: '#09090d'
      }
    };

    const ACCESSORIES = [
      { id: 'none', label: 'NONE', cost: 0 },
      { id: 'bow', label: 'PINK BOW', cost: 0 },
      { id: 'shades', label: 'SHADES', cost: 10 },
      { id: 'daisy', label: 'DAISY', cost: 12 },
      { id: 'scarf', label: 'SCARF', cost: 15 },
      { id: 'frog', label: 'FROG HAT', cost: 20 },
      { id: 'crown', label: 'CROWN', cost: 30 }
    ];

    const FOODS = [
      { id: 'fish', label: 'FISH', icon: '🐟', cost: 0, hunger: 20, fun: 4, energy: 2, msg: 'YUMMY FISH!' },
      { id: 'milk', label: 'MILK', icon: '🥛', cost: 0, hunger: 16, fun: 4, energy: 6, msg: 'SLURP SLURP~' },
      { id: 'boba', label: 'BOBA', icon: '🧋', cost: 5, hunger: 22, fun: 16, energy: 8, msg: 'SWEET BOBA!' },
      { id: 'sushi', label: 'SUSHI', icon: '🍣', cost: 8, hunger: 36, fun: 10, energy: 5, msg: 'FANCY SUSHI!' },
      { id: 'cake', label: 'CAKE', icon: '🍰', cost: 10, hunger: 30, fun: 26, energy: 6, msg: 'BEST CAKE <3' }
    ];

    const state = {
      screen: 'title', // 'title' | 'hub' | 'bedroom' | 'bathroom' | 'playroom' | 'kitchen' | 'closet'
      petName: 'MOCHI',
      coins: 25,
      muted: false,
      stats: {
        hunger: 82,
        hygiene: 78,
        energy: 85,
        fun: 80
      },
      fur: 'classic',
      accessory: 'none',
      ownedAccessories: ['none', 'bow'],
      closetTab: 'acc', // 'acc' | 'fur'
      highScore: 0,

      // Room states
      bedroom: {
        lampOn: true,
        sleeping: false,
        lullabyTimer: 0
      },
      bathroom: {
        spongeActive: false,
        showerOn: false,
        soapLevel: 0, // 0..100
        soapBubbles: [], // bubbles stuck on cat
        duckHop: 0,
        waterDrops: []
      },
      playroom: {
        recording: false,
        mimicking: false,
        audioAmp: 0,
        micLevel: 0,
        yarn: { active: false, x: 240, y: 195, vx: 0, vy: 0, rot: 0 },
        miniGame: {
          active: false,
          score: 0,
          coinsEarned: 0,
          timeLeft: 30,
          catX: W / 2,
          targetX: W / 2,
          items: [],
          spawnTimer: 0,
          gameOver: false
        }
      },
      kitchen: {
        flyingFood: null, // { id, sx, sy, x, y, t, food }
        chewTimer: 0
      },

      // Cat live animation & expression state
      cat: {
        x: W / 2,
        y: 160,
        hopY: 0,
        hopVy: 0,
        expression: 'idle', // 'idle' | 'happy' | 'surprised' | 'talking' | 'eating' | 'sleeping'
        exprTimer: 0,
        blinkTimer: 2.5,
        isBlinking: false,
        mouthOpen: 0, // 0..1
        speechText: '',
        speechTimer: 0,
        petRubDist: 0,
        purrCooldown: 0
      },

      // Particles & UI Hover
      particles: [],
      hoveredRoom: null,
      hoveredPlayBtn: false,
      pointerDown: false,
      pointerX: 0,
      pointerY: 0,
      lastPointerX: 0,
      lastPointerY: 0,
      pointerDownTime: 0,
      pointerMovedDist: 0,
      keys: { left: false, right: false }
    };

    function saveState() {
      try {
        const data = {
          petName: state.petName,
          coins: state.coins,
          muted: state.muted,
          stats: state.stats,
          fur: state.fur,
          accessory: state.accessory,
          ownedAccessories: state.ownedAccessories,
          highScore: state.highScore
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // Ignore storage quota / iframe restrictions
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.petName) state.petName = String(data.petName).slice(0, 10);
        if (typeof data.coins === 'number') state.coins = Math.max(0, Math.floor(data.coins));
        if (typeof data.muted === 'boolean') state.muted = data.muted;
        if (data.stats) {
          ['hunger', 'hygiene', 'energy', 'fun'].forEach(k => {
            if (typeof data.stats[k] === 'number') {
              state.stats[k] = Math.max(5, Math.min(100, data.stats[k]));
            }
          });
        }
        if (data.fur && FUR_PALETTES[data.fur]) state.fur = data.fur;
        if (Array.isArray(data.ownedAccessories)) state.ownedAccessories = data.ownedAccessories;
        if (data.accessory) state.accessory = data.accessory;
        if (typeof data.highScore === 'number') state.highScore = data.highScore;
      } catch (e) {
        // Fallback to defaults
      }
    }

    // -------------------------------------------------------------------------
    // 2. 8-BIT WEB AUDIO SYNTHESIZER + VOICE MIMIC ENGINE
    // -------------------------------------------------------------------------
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.noiseBuf = null;
        this.showerNode = null;
        this.showerGain = null;

        // Voice mimic properties
        this.mediaStream = null;
        this.mediaRecorder = null;
        this.recordedChunks = [];
        this.micAnalyser = null;
        this.micData = null;
        this.playAnalyser = null;
        this.playData = null;
        this.activeSource = null;
        this.recordTimeout = null;
      }

      ensure() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();
          // Create 1s reusable white noise buffer for crunch/shower/purr
          const len = this.ctx.sampleRate;
          this.noiseBuf = this.ctx.createBuffer(1, len, len);
          const ch = this.noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      tone(freq, endFreq, dur, type = 'square', vol = 0.12, delay = 0) {
        if (state.muted) return;
        const ctx = this.ensure();
        if (!ctx) return;
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq !== freq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), now + dur);
        }
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      playClick() {
        this.tone(540, 720, 0.06, 'square', 0.08);
      }

      playStartChime() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, i) => this.tone(n, n, 0.11, 'square', 0.09, i * 0.07));
      }

      playCoin() {
        this.tone(987.77, 987.77, 0.07, 'square', 0.09, 0);
        this.tone(1318.5, 1318.5, 0.18, 'square', 0.09, 0.07);
      }

      playBoop() {
        this.tone(360, 760, 0.11, 'triangle', 0.16);
        this.tone(760, 520, 0.09, 'sine', 0.12, 0.09);
      }

      playMeow(variant = 0) {
        if (state.muted) return;
        const base = [620, 700, 560, 780][variant % 4];
        this.tone(base, base * 1.45, 0.14, 'triangle', 0.15, 0);
        this.tone(base * 1.45, base * 0.92, 0.22, 'triangle', 0.13, 0.12);
        this.tone(base * 1.01, base * 1.44, 0.14, 'square', 0.035, 0);
      }

      playPurr() {
        if (state.muted) return;
        const ctx = this.ensure();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        const mainGain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(52, now);
        lfo.frequency.setValueAtTime(24, now);
        lfoGain.gain.setValueAtTime(0.05, now);
        mainGain.gain.setValueAtTime(0.001, now);
        mainGain.gain.linearRampToValueAtTime(0.06, now + 0.05);
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 180;

        lfo.connect(lfoGain);
        lfoGain.connect(mainGain.gain);
        osc.connect(filter);
        filter.connect(mainGain);
        mainGain.connect(ctx.destination);
        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.36);
        lfo.stop(now + 0.36);
      }

      playBubblePop() {
        const f = 450 + Math.random() * 450;
        this.tone(f, f * 2.1, 0.07, 'sine', 0.11);
      }

      playDuckSqueak() {
        this.tone(1150, 1520, 0.09, 'square', 0.08, 0);
        this.tone(1480, 1020, 0.1, 'triangle', 0.11, 0.07);
      }

      playCrunch() {
        if (state.muted) return;
        const ctx = this.ensure();
        if (!ctx || !this.noiseBuf) return;
        for (let i = 0; i < 3; i++) {
          const now = ctx.currentTime + i * 0.14;
          const src = ctx.createBufferSource();
          src.buffer = this.noiseBuf;
          const filt = ctx.createBiquadFilter();
          filt.type = 'bandpass';
          filt.frequency.value = 1200 + i * 250;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.14, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          src.connect(filt);
          filt.connect(g);
          g.connect(ctx.destination);
          src.start(now);
          src.stop(now + 0.09);
        }
      }

      playLullabyNote(step) {
        const melody = [523.25, 659.25, 783.99, 659.25, 587.33, 659.25, 523.25];
        const f = melody[step % melody.length];
        this.tone(f, f, 0.42, 'triangle', 0.06);
      }

      setShowerSound(on) {
        if (state.muted || !on) {
          if (this.showerNode) {
            try { this.showerNode.stop(); } catch (e) {}
            this.showerNode = null;
          }
          return;
        }
        const ctx = this.ensure();
        if (!ctx || !this.noiseBuf || this.showerNode) return;
        const src = ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        src.loop = true;
        const filt = ctx.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.value = 1900;
        filt.Q.value = 0.6;
        const g = ctx.createGain();
        g.gain.value = 0.055;
        src.connect(filt);
        filt.connect(g);
        g.connect(ctx.destination);
        src.start();
        this.showerNode = src;
        this.showerGain = g;
      }

      // ---- Talking Tom Voice Mimic (Pitch-shifted Web Audio playback) ----
      async startRecording() {
        if (state.playroom.recording) return;
        const ctx = this.ensure();
        if (!ctx) {
          showToast('Audio unavailable - try SAY MEOW!');
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Mic not supported here - try SAY MEOW!');
          triggerSyntheticMeow();
          return;
        }
        try {
          // Stop any existing mimic playback
          if (this.activeSource) {
            try { this.activeSource.stop(); } catch (e) {}
            this.activeSource = null;
          }
          state.playroom.mimicking = false;

          if (!this.mediaStream) {
            this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }

          // Setup live mic analyser for pixel waveform visualizer
          const micSource = ctx.createMediaStreamSource(this.mediaStream);
          this.micAnalyser = ctx.createAnalyser();
          this.micAnalyser.fftSize = 256;
          this.micData = new Uint8Array(this.micAnalyser.frequencyBinCount);
          micSource.connect(this.micAnalyser);

          this.recordedChunks = [];
          this.mediaRecorder = new MediaRecorder(this.mediaStream);
          this.mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) this.recordedChunks.push(e.data);
          };
          this.mediaRecorder.onstop = () => {
            this.processAndMimic();
          };

          this.mediaRecorder.start();
          state.playroom.recording = true;
          state.cat.speechText = 'LISTENING...';
          state.cat.speechTimer = 5;
          updateActionDeck();

          // Auto-stop after 5 seconds max
          clearTimeout(this.recordTimeout);
          this.recordTimeout = setTimeout(() => {
            if (state.playroom.recording) this.stopRecording();
          }, 5000);
        } catch (err) {
          state.playroom.recording = false;
          updateActionDeck();
          showToast('Mic permission needed - try SAY MEOW!');
          triggerSyntheticMeow();
        }
      }

      stopRecording() {
        clearTimeout(this.recordTimeout);
        if (!state.playroom.recording) return;
        state.playroom.recording = false;
        state.playroom.micLevel = 0;
        if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
          try { this.mediaRecorder.stop(); } catch (e) {}
        }
        updateActionDeck();
      }

      async processAndMimic() {
        const ctx = this.ensure();
        if (!ctx || this.recordedChunks.length === 0) return;
        try {
          const blob = new Blob(this.recordedChunks);
          const arrBuf = await blob.arrayBuffer();
          const audioBuf = await ctx.decodeAudioData(arrBuf);

          if (audioBuf.duration < 0.15) {
            triggerSyntheticMeow();
            return;
          }

          const src = ctx.createBufferSource();
          src.buffer = audioBuf;
          src.playbackRate.value = 1.48; // Classic cute Talking Tom pitch-shift!

          this.playAnalyser = ctx.createAnalyser();
          this.playAnalyser.fftSize = 256;
          this.playData = new Uint8Array(this.playAnalyser.frequencyBinCount);

          const gain = ctx.createGain();
          gain.gain.value = state.muted ? 0 : 1.15;

          src.connect(this.playAnalyser);
          this.playAnalyser.connect(gain);
          gain.connect(ctx.destination);

          this.activeSource = src;
          state.playroom.mimicking = true;
          state.cat.expression = 'talking';
          state.cat.speechText = `${state.petName} SAYS...`;
          state.cat.speechTimer = (audioBuf.duration / 1.48) + 0.5;
          addStat('fun', 8);

          src.onended = () => {
            state.playroom.mimicking = false;
            state.playroom.audioAmp = 0;
            state.cat.mouthOpen = 0;
            if (state.cat.expression === 'talking') state.cat.expression = 'idle';
            this.activeSource = null;
          };

          src.start();
        } catch (err) {
          triggerSyntheticMeow();
        }
      }

      sampleAmplitude() {
        if (state.playroom.recording && this.micAnalyser && this.micData) {
          this.micAnalyser.getByteTimeDomainData(this.micData);
          let sum = 0;
          for (let i = 0; i < this.micData.length; i++) {
            const v = (this.micData[i] - 128) / 128;
            sum += v * v;
          }
          state.playroom.micLevel = Math.min(1, Math.sqrt(sum / this.micData.length) * 4.5);
        }
        if (state.playroom.mimicking && this.playAnalyser && this.playData) {
          this.playAnalyser.getByteTimeDomainData(this.playData);
          let sum = 0;
          for (let i = 0; i < this.playData.length; i++) {
            const v = (this.playData[i] - 128) / 128;
            sum += v * v;
          }
          const amp = Math.min(1, Math.sqrt(sum / this.playData.length) * 5.2);
          state.playroom.audioAmp = amp;
          state.cat.mouthOpen = amp > 0.08 ? Math.min(1, amp * 1.4) : 0;
        }
      }
    }

    const audio = new RetroAudio();

    // -------------------------------------------------------------------------
    // 3. OFF-SCREEN PROCEDURAL MEADOW TILEMAP (Matches Mockups 1 & 2!)
    // -------------------------------------------------------------------------
    const meadowCanvas = document.createElement('canvas');
    meadowCanvas.width = W;
    meadowCanvas.height = H;
    const mctx = meadowCanvas.getContext('2d');

    function buildMeadowTilemap() {
      // Base deep forest green (#1f4d36)
      mctx.fillStyle = '#1f4d36';
      mctx.fillRect(0, 0, W, H);

      // Helper to draw a dark leafy border tile (10x10)
      function drawBorderLeaf(x, y) {
        mctx.fillStyle = '#143324';
        mctx.fillRect(x, y, 10, 10);
        mctx.fillStyle = '#19402d';
        mctx.fillRect(x + 2, y + 1, 6, 3);
        mctx.fillRect(x + 1, y + 4, 8, 3);
        mctx.fillRect(x + 3, y + 7, 4, 2);
        mctx.fillStyle = '#24573d';
        mctx.fillRect(x + 3, y + 2, 2, 1);
        mctx.fillRect(x + 6, y + 5, 2, 1);
      }

      // Draw dark leafy border around all 4 edges (top 14px, bottom 14px, sides 14px)
      for (let x = 0; x < W; x += 10) {
        drawBorderLeaf(x, 0);
        drawBorderLeaf(x, H - 12);
      }
      for (let y = 10; y < H - 10; y += 10) {
        drawBorderLeaf(0, y);
        drawBorderLeaf(W - 10, y);
      }
      // Inner subtle dark border line
      mctx.fillStyle = '#173b29';
      mctx.fillRect(10, 10, W - 20, 2);
      mctx.fillRect(10, H - 14, W - 20, 2);

      // Helper: Light-green pixel grass tuft (7x6) matching mockup tufts
      function drawTuft(x, y) {
        mctx.fillStyle = '#133021'; // dark base shadow
        mctx.fillRect(x, y + 5, 7, 1);
        mctx.fillStyle = '#5fa367'; // mid green
        mctx.fillRect(x, y + 3, 7, 2);
        mctx.fillRect(x + 1, y + 2, 5, 1);
        mctx.fillStyle = '#89c981'; // bright top highlight
        mctx.fillRect(x + 2, y + 1, 3, 2);
        mctx.fillRect(x + 3, y, 1, 1);
        mctx.fillStyle = '#3d7347'; // lower shade accents
        mctx.fillRect(x + 1, y + 4, 2, 1);
        mctx.fillRect(x + 4, y + 4, 2, 1);
      }

      // Helper: Dark-green chevron grass marks (pair of ^ ^)
      function drawChevronPair(x, y) {

        mctx.fillRect(x + 4, y + 1, 2, 1);
        mctx.fillRect(x, y + 2, 2, 1);
        mctx.fillRect(x + 5, y + 2, 2, 1);
        // lower chevron
        mctx.fillRect(x + 2, y + 7, 3, 1);
        mctx.fillRect(x + 1, y + 8, 2, 1);
        mctx.fillRect(x + 4, y + 8, 2, 1);
        mctx.fillRect(x, y + 9, 2, 1);
        mctx.fillRect(x + 5, y + 9, 2, 1);

      // Helper: Tiny white pixel daisy with golden yellow center
      function drawDaisy(x, y) {

        mctx.fillRect(x, y + 2, 9, 4);
        mctx.fillStyle = '#e4e8ec';

        mctx.fillRect(x + 3, y + 3, 3, 2);

      }

      // Place winding maze-like rows & columns of grass tufts matching mockup 1 & 2!
      const tuftRows = [
        // Top center-left strip
        { x: 132, y: 20, count: 7, dx: 9, dy: 0 },

        { x: 40, y: 34, count: 5, dx: 0, dy: 9 },
        { x: 64, y: 34, count: 5, dx: 0, dy: 9 },
        // Upper mid-left cluster
        { x: 114, y: 44, count: 3, dx: 8, dy: 0 },
        // Left vertical winding wall
        { x: 78, y: 66, count: 10, dx: 0, dy: 10 },
        { x: 35, y: 136, count: 7, dx: 0, dy: 10 },
        { x: 44, y: 196, count: 4, dx: 9, dy: 0 },
        { x: 66, y: 206, count: 4, dx: 0, dy: 10 },
        { x: 40, y: 244, count: 3, dx: 9, dy: 0 },
        // Central enclosing L-frame around cat (like mockup!)
        { x: 140, y: 80, count: 13, dx: 9, dy: 0 },
        { x: 139, y: 90, count: 13, dx: 0, dy: 10 },
        // Right winding rectangle
        { x: 262, y: 88, count: 8, dx: 9, dy: 0 },
        { x: 262, y: 118, count: 8, dx: 9, dy: 0 },
        { x: 326, y: 54, count: 4, dx: 0, dy: 10 },
        // Upper right vertical columns
        { x: 246, y: 28, count: 5, dx: 0, dy: 9 },
        { x: 270, y: 28, count: 5, dx: 0, dy: 9 },
        // Lower right paths
        { x: 236, y: 174, count: 4, dx: 0, dy: 10 },
        { x: 212, y: 174, count: 4, dx: 0, dy: 10 },
        { x: 252, y: 216, count: 7, dx: 9, dy: 0 },
        { x: 312, y: 184, count: 7, dx: 0, dy: 10 },
        { x: 334, y: 158, count: 7, dx: 0, dy: 10 },
        { x: 276, y: 150, count: 3, dx: 8, dy: 0 },
        // Bottom center tufts
        { x: 108, y: 204, count: 4, dx: 0, dy: 10 },

      tuftRows.forEach(r => {
        for (let i = 0; i < r.count; i++) {

      // Scattered lone tufts
      [[186, 42], [218, 56], [110, 72], [110, 126], [246, 140], [326, 102], [44, 222], [214, 244], [262, 242], [274, 178]]

      // Scattered dark chevron pairs
      [[22, 30], [22, 84], [22, 160], [22, 210], [50, 82], [92, 56], [128, 86], [164, 52],
       [218, 28], [302, 42], [302, 134], [344, 48], [344, 118], [344, 200], [112, 148], [88, 224]]
        .forEach(([x, y]) => drawChevronPair(x, y));

      // White pixel daisies with yellow centers matching mockup positions
      [[66, 54], [248, 36], [254, 76], [326, 114], [132, 165], [34, 195], [238, 220]]
        .forEach(([x, y]) => drawDaisy(x, y));
    }

    buildMeadowTilemap();

    // -------------------------------------------------------------------------
    // 4. PIXEL CAT SPRITE RENDERER (EXACT MOCKUP DESIGN + ANIMATIONS + DRESS-UP)
    // -------------------------------------------------------------------------
    /**
     * Draws our adorable white-and-taupe pixel cat at center (cx, cy) with pixel scale `s`.
     * Matches image_a83cc7.png: thick black outlines, square-round head, taupe top-left patch
     * & curving wagging tail, pink inner ears, black square eyes, rosy blush cheeks, 'u' mouth,
     * horizontal collar/neck line, 4 stubby white paws.
     */
    function drawPixelCat(ctx, cx, cy, s, time, opts = {}) {
      const pal = FUR_PALETTES[state.fur] || FUR_PALETTES.classic;
      const expr = opts.expression || state.cat.expression;
      const isSleeping = expr === 'sleeping';
      const isBlinking = opts.blink ?? state.cat.isBlinking;
      const mouthOpen = opts.mouthOpen ?? state.cat.mouthOpen;
      const hopY = opts.hopY || 0;
      const breath = isSleeping ? Math.sin(time * 2.2) * 0.35 : (Math.sin(time * 3.8) > 0.55 ? 0.5 : 0);

      // Anchor grid: 20 wide x 20 tall in cat-pixel units
      const ox = Math.round(cx - 10 * s);
      const oy = Math.round(cy - 11 * s + hopY + breath * s * 0.6);

      const px = (gx, gy, w, h, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(ox + gx * s), Math.round(oy + gy * s), Math.round(w * s), Math.round(h * s));
      };

      // Ground shadow (skipped when tucked in bed)
      if (!opts.inBed) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
        const shScale = Math.max(0.65, 1 + hopY / 50);
        ctx.fillRect(
          Math.round(cx - 6.5 * s * shScale),
          Math.round(cy + 8.2 * s),
          Math.round(13 * s * shScale),
          Math.round(2.2 * s)
        );
      }

      // ---- 1. CURVING WAGGING TAIL (Left side, taupe/brown with thick black outline) ----
      const wag = isSleeping ? 0 : Math.round(Math.sin(time * (expr === 'happy' ? 12 : 4.2)) * 1);
      if (!opts.inBed) {
        // Tail outline
        px(3, 15, 3, 3, pal.outline);
        px(1, 13 + wag, 3, 3, pal.outline);
        px(0, 11 + wag, 3, 3, pal.outline);
        // Tail inner fill
        px(4, 16, 2, 1, pal.patchDark);
        px(2, 14 + wag, 2, 2, pal.patch);
        px(1, 12 + wag, 1, 2, pal.patch);
      }

      // ---- 2. BODY & 4 STUBBY PAWS (Hidden if tucked under blanket in bed) ----
      if (!opts.inBed) {
        // Thick black body outline
        px(5, 12, 10, 7, pal.outline);
        px(5, 18, 4, 2, pal.outline); // left paws outer
        px(11, 18, 4, 2, pal.outline); // right paws outer
        px(8, 17, 4, 2, pal.outline); // inner paw gap

        // White body fill
        px(6, 13, 8, 4, pal.body);
        // Subtle taupe patch on left hip (faithful to mockup!)
        px(6, 13, 2, 2, pal.patch);
        px(6, 15, 1, 2, pal.shade);
        // 4 little stubby paws
        px(6, 17, 2, 2, pal.body); // outer left paw
        px(8, 17, 1, 1, pal.shade);
        px(9, 17, 2, 1, pal.body); // mid belly
        px(12, 17, 2, 2, pal.body); // outer right paw
        px(10, 16, 1, 2, pal.outline); // leg separation pixel
        px(7, 17, 1, 2, pal.outline); // subtle front paw split
      }

      // ---- 3. HEAD & EARS (Exact square-rounded silhouette from mockup) ----
      // Ear outlines
      px(4, 1, 4, 4, pal.outline);
      px(12, 1, 4, 4, pal.outline);
      // Top head outline
      px(7, 2, 6, 2, pal.outline);
      // Side cheeks outline
      px(3, 5, 14, 6, pal.outline);
      // Lower chin / collar outline
      px(4, 11, 12, 2, pal.outline);

      // Head base white fill
      px(4, 5, 12, 6, pal.body);
      px(5, 3, 10, 9, pal.body);

      // Ear fills (taupe/brown patch on top-left & subtle right ear edge + soft pink inner ears)
      px(5, 2, 2, 3, pal.patch);
      px(5, 3, 2, 2, pal.earInner); // left pink inner ear
      px(7, 3, 2, 2, pal.patch);    // taupe forehead patch (mockup exact!)
      px(6, 4, 2, 2, pal.shade);    // soft shading below patch

      px(13, 2, 2, 3, pal.patch);
      px(13, 3, 2, 2, pal.earInner); // right pink inner ear
      px(12, 3, 1, 1, pal.shade);

      // Subtle left cheek shading (gives mockup's soft 3D pixel depth)
      px(4, 6, 1, 4, pal.shade);
      px(5, 10, 1, 1, pal.shade);

      // ---- 4. FACE: EYES, BLUSH CHEEKS, CUTE 'U' MOUTH ----
      // Rosy pink blush cheeks
      const blushW = expr === 'happy' ? 2 : 1;
      px(4, 9, blushW, 1, pal.blush);
      px(16 - blushW, 9, blushW, 1, pal.blush);

      // Eyes based on expression
      if (isSleeping) {
        // Peaceful closed lines (- -)
        px(6, 8, 2, 1, pal.outline);
        px(12, 8, 2, 1, pal.outline);
      } else if (expr === 'happy') {
        // Happy squinting arcs (^ ^)
        px(6, 7, 2, 1, pal.outline);
        px(5, 8, 1, 1, pal.outline);
        px(8, 8, 1, 1, pal.outline);

        px(12, 7, 2, 1, pal.outline);
        px(11, 8, 1, 1, pal.outline);
        px(14, 8, 1, 1, pal.outline);
      } else if (expr === 'surprised') {
        // Wide surprised eyes (O O) with bright pixel catchlight
        px(6, 6, 2, 3, pal.outline);
        px(12, 6, 2, 3, pal.outline);
        px(6, 6, 1, 1, '#ffffff');
        px(12, 6, 1, 1, '#ffffff');
      } else if (isBlinking) {
        px(6, 8, 2, 1, pal.outline);
        px(12, 8, 2, 1, pal.outline);
      } else {
        // Classic mockup crisp 2x2 black square eyes!
        px(6, 7, 2, 2, pal.outline);
        px(12, 7, 2, 2, pal.outline);
      }

      // Mouth: animated open mouth when talking/meowing/eating, else cute 'u' mouth!
      if (mouthOpen > 0.25 || expr === 'eating') {
        const openH = mouthOpen > 0.65 ? 2.4 : 1.7;
        px(9, 8.2, 2, openH, pal.outline);
        px(9.4, 8.7, 1.2, Math.max(0.7, openH - 0.8), '#eb6c7d'); // cute pink tongue
      } else if (expr === 'surprised') {
        px(9.3, 8.5, 1.4, 1.4, pal.outline);
      } else {
        // Exact mockup little 'u' mouth centered between eyes
        px(9, 8, 0.7, 1.2, pal.outline);
        px(10.3, 8, 0.7, 1.2, pal.outline);
        px(9.2, 9, 1.6, 0.8, pal.outline);
      }

      // ---- 5. EQUIPPED ACCESSORIES (Renders seamlessly in ALL rooms!) ----
      const acc = opts.accessory !== undefined ? opts.accessory : state.accessory;
      if (acc === 'bow') {
        // Cute pixel pink ribbon bow perched on left ear
        px(4, 1, 5, 3, '#09090d');
        px(4.5, 1.5, 1.5, 2, '#ff77a8');
        px(7, 1.5, 1.5, 2, '#ff77a8');
        px(6, 2, 1, 1, '#ffd1e3');
      } else if (acc === 'shades') {
        // Cool retro pixel sunglasses
        px(4, 7, 12, 1, '#09090d');
        px(5, 7, 4, 2.4, '#111524');
        px(11, 7, 4, 2.4, '#111524');
        px(5.5, 7.4, 1, 0.8, '#8be9fd'); // crisp pixel glint
        px(11.5, 7.4, 1, 0.8, '#8be9fd');
      } else if (acc === 'crown') {
        // Golden pixel crown with ruby gem
        px(7, -1, 6, 4, '#09090d');
        px(7.5, 0, 1, 2.5, '#ffd43b');
        px(9.5, -0.5, 1, 3, '#ffd43b');
        px(11.5, 0, 1, 2.5, '#ffd43b');
        px(7.5, 1.5, 5, 1, '#f59f00');
        px(9.5, 1.3, 1, 1, '#ff4d6d'); // ruby gem
      } else if (acc === 'daisy') {
        // Meadow daisy flower crown
        const dxs = [6.5, 9.5, 12.5];
        dxs.forEach(dx => {
          px(dx - 0.6, 1.4, 2.2, 2.2, '#ffffff');
          px(dx, 2, 1, 1, '#f5cf38');
        });
      } else if (acc === 'frog') {
        // Adorable green pixel frog hood on top of head
        px(4.5, 0, 11, 3.5, '#09090d');
        px(5, 0.5, 10, 2.5, '#5ec269');
        // Two cute bumpy frog eyes
        px(5.5, -1, 2.5, 2, '#09090d');
        px(12, -1, 2.5, 2, '#09090d');
        px(6, -0.5, 1.5, 1.2, '#ffffff');
        px(12.5, -0.5, 1.5, 1.2, '#ffffff');
        px(6.5, -0.2, 0.7, 0.7, '#09090d');
        px(13, -0.2, 0.7, 0.7, '#09090d');
      } else if (acc === 'scarf' && !opts.inBed) {
        // Cozy red pixel scarf around neck with trailing tail
        px(5, 11.5, 10, 2.5, '#09090d');
        px(5.5, 12, 9, 1.5, '#e64553');
        px(6.5, 12, 1.5, 1.5, '#ff8590');
        px(11, 13.5, 2.5, 3, '#09090d');
        px(11.5, 13.5, 1.5, 2.5, '#e64553');
      }

      // ---- 6. SOAP SUDS OVERLAY (Bathroom scrubbing) ----
      if (opts.soapBubbles && opts.soapBubbles.length > 0) {
        opts.soapBubbles.forEach(b => {

    // Helper: Draw a pixel-stepped isometric diamond/quad polygon
    function fillPoly(ctx, pts, fill, stroke = null) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Helper for isometric floor interpolation
    function isoLerp(a, b, c, d, u, v) {
      const topX = a[0] + (b[0] - a[0]) * u;
      const topY = a[1] + (b[1] - a[1]) * u;
      const botX = c[0] + (d[0] - c[0]) * u;
      const botY = c[1] + (d[1] - c[1]) * u;
      return [topX + (botX - topX) * v, topY + (botY - topY) * v];
    }

    function drawRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // -------------------------------------------------------------------------
    // 9. PIXEL PARTICLES & SPEECH BUBBLE OVERLAYS
    // -------------------------------------------------------------------------
    function spawnParticles(type, x, y, count = 5) {
      for (let i = 0; i < count; i++) {
        state.particles.push({
          type,
          x: x + (Math.random() - 0.5) * 26,
          y: y + (Math.random() - 0.5) * 14,
          vx: (Math.random() - 0.5) * 24,
          vy: -18 - Math.random() * 24,
          life: 0.9 + Math.random() * 0.5,
          maxLife: 1.4
        });
      }
    }

    function drawParticles(ctx) {
      state.particles.forEach(p => {
        const x = Math.round(p.x), y = Math.round(p.y);
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.6));
        if (p.type === 'heart') {
          ctx.fillStyle = '#ff5e8e';
          ctx.fillRect(x - 3, y - 2, 2, 2);
          ctx.fillRect(x + 1, y - 2, 2, 2);
          ctx.fillRect(x - 2, y, 4, 2);
          ctx.fillRect(x - 1, y + 2, 2, 1);
        } else if (p.type === 'sparkle') {
          ctx.fillStyle = '#fff280';
          ctx.fillRect(x, y - 3, 1, 7);
          ctx.fillRect(x - 3, y, 7, 1);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x, y, 1, 1);
        } else if (p.type === 'zzz') {
          ctx.fillStyle = '#d9b8ff';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('Z', x, y);
        } else if (p.type === 'bubble') {
          ctx.fillStyle = '#b3f0ff';
          ctx.fillRect(x - 2, y - 2, 5, 5);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(x - 1, y - 1, 2, 2);
        } else if (p.type === 'crumb') {
          ctx.fillStyle = '#f2c166';
          ctx.fillRect(x, y, 3, 3);
        } else if (p.type === 'note') {
          ctx.fillStyle = '#ffe082';
          ctx.fillRect(x, y, 3, 3);
          ctx.fillRect(x + 2, y - 5, 1, 6);
          ctx.fillRect(x + 2, y - 5, 3, 2);
        }
        ctx.globalAlpha = 1;
      });
    }

    function drawSpeechBubble(ctx) {
      if (state.cat.speechTimer <= 0 || !state.cat.speechText) return;
      if (state.screen === 'hub' || state.playroom.miniGame.active) return;

      const text = state.cat.speechText;
      ctx.font = '6.5px "Press Start 2P", monospace';
      const tw = Math.max(46, ctx.measureText(text).width + 14);
      const bx = Math.max(12, Math.min(W - tw - 12, Math.round(getCatCenter().x - tw / 2)));
      const by = Math.max(12, Math.round(getCatCenter().y - 68));

      ctx.fillStyle = '#09090d';
      drawRoundedRect(ctx, bx - 2, by - 2, tw + 4, 22, 5);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      drawRoundedRect(ctx, bx, by, tw, 18, 4);
      ctx.fill();
      // Little bubble pointer tail
      ctx.fillStyle = '#09090d';
      ctx.fillRect(bx + tw / 2 - 3, by + 18, 6, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + tw / 2 - 2, by + 17, 4, 3);

      ctx.fillStyle = '#2a3356';
      ctx.textAlign = 'center';
      ctx.fillText(text, bx + tw / 2, by + 12);
    }
